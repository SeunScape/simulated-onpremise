# Adapted from apache/fineract@1.12.1:
#   docker-compose-postgresql.yml, docker-compose-web-app.yml,
#   config/docker/compose/{postgresql,fineract}.yml, config/docker/env/*.env
# Versions and digests are recorded in docs/fineract-notes.md.
# Every published port is bound to 127.0.0.1; reach them through an SSH tunnel.
# Secrets come from ./.env, which exists only on the server (see scripts/deploy-fineract.sh).

services:

  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FINERACT_DB_USER: postgres
      FINERACT_DB_PASS: ${FINERACT_DB_PASS:?set in .env}
      FINERACT_TENANTS_DB_NAME: fineract_tenants
      FINERACT_TENANT_DEFAULT_DB_NAME: fineract_default
    volumes:
      - ./postgres-init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root" ]
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  fineract:
    image: apache/fineract:1.12.1@sha256:a83cf1980609c984281a4741344bfe1c6df8a0c2dcc0ae6cee337cded1dc53fe
    depends_on:
      db:
        condition: service_healthy
    environment:
      # fineract.env
      FINERACT_NODE_ID: "1"
      # fineract-common.env
      FINERACT_HIKARI_MINIMUM_IDLE: "3"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "10"
      FINERACT_HIKARI_IDLE_TIMEOUT: "60000"
      FINERACT_HIKARI_CONNECTION_TIMEOUT: "20000"
      FINERACT_HIKARI_TEST_QUERY: SELECT 1
      FINERACT_HIKARI_AUTO_COMMIT: "true"
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_HIKARI_DS_PROPERTIES_CACHE_PREP_STMTS: "true"
      FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SIZE: "250"
      FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SQL_LIMIT: "2048"
      FINERACT_HIKARI_DS_PROPERTIES_USE_SERVER_PREP_STMTS: "true"
      FINERACT_HIKARI_DS_PROPERTIES_USE_LOCAL_SESSION_STATE: "true"
      FINERACT_HIKARI_DS_PROPERTIES_REWRITE_BATCHED_STATEMENTS: "true"
      FINERACT_HIKARI_DS_PROPERTIES_CACHE_RESULT_SET_METADATA: "true"
      FINERACT_HIKARI_DS_PROPERTIES_CACHE_SERVER_CONFIGURATION: "true"
      FINERACT_HIKARI_DS_PROPERTIES_ELIDE_SET_AUTO_COMMITS: "true"
      FINERACT_HIKARI_DS_PROPERTIES_MAINTAIN_TIME_STATS: "false"
      FINERACT_HIKARI_DS_PROPERTIES_LOG_SLOW_QUERIES: "true"
      FINERACT_HIKARI_DS_PROPERTIES_DUMP_QUERIES_IN_EXCEPTION: "true"
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Lagos
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Default Demo Tenant
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASS:?set in .env}
      FINERACT_DEFAULT_MASTER_PASSWORD: ${FINERACT_DEFAULT_MASTER_PASSWORD:?set in .env}
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      FINERACT_MANAGEMENT_METRICS_TAGS_APPLICATION: fineract
      FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED: "true"
      FINERACT_INSECURE_HTTP_CLIENT: "true"
      SPRING_PROFILES_ACTIVE: test,diagnostics
      OTEL_SERVICE_NAME: fineract
      JAVA_TOOL_OPTIONS: >-
        -Xmx1G -XX:MinRAMPercentage=25 -XX:MaxRAMPercentage=80 -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport -XX:+UseStringDeduplication
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
      # fineract-postgresql.env
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: postgres
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASS:?set in .env}
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: postgres
    healthcheck:
      test: ["CMD", 'sh', '-c', 'echo -e "Checking for the availability of Fineract server deployment"; while ! nc -z "localhost" 8443; do sleep 1; printf "-"; done; echo -e " >> Fineract server has started";' ]
      timeout: 1s
      retries: 60
    ports:
      - "127.0.0.1:8443:8443"

  web-app:
    image: openmf/web-app:1.14@sha256:18dae7cc7701669ccd983b8bd879bec2a68bb7166a4a4fc7e37661b4b7ef912b
    container_name: mifos-web-app
    restart: always
    # Read by the browser, so the API URL is the laptop end of the SSH tunnel.
    environment:
      FINERACT_API_URLS: https://localhost:8443
      FINERACT_API_URL: https://localhost:8443
      FINERACT_PLATFORM_TENANT_IDENTIFIER: default
    ports:
      - "127.0.0.1:4200:80"

volumes:
  pgdata:
